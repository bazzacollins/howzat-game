<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Howzat!</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f8fbff;
      --muted: #b8c7d9;
      --deep: #071924;
      --panel: rgba(8, 27, 39, 0.86);
      --panel-strong: rgba(3, 16, 25, 0.92);
      --line: rgba(255, 255, 255, 0.16);
      --mint: #7ae6b8;
      --gold: #f7c948;
      --blue: #43b7ff;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.32);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px) center / 88px 100%,
        linear-gradient(180deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px) center / 100% 88px,
        linear-gradient(140deg, #0d4d3f 0%, #102836 42%, #06131e 100%);
    }

    button {
      font: inherit;
    }

    .app {
      width: min(1120px, calc(100% - 32px));
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 0;
      display: grid;
      place-items: center;
    }

    .game-shell {
      width: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .hero {
      position: relative;
      min-height: 230px;
      display: grid;
      align-items: end;
      isolation: isolate;
      background: #0a2431;
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(2, 15, 24, 0.06) 20%, rgba(2, 15, 24, 0.75) 100%);
    }

    .title-image {
      position: absolute;
      inset: 0;
      z-index: -2;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .hero-copy {
      width: min(900px, calc(100% - 40px));
      padding: 0 0 22px;
      margin: 0 auto;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 7vw, 5.6rem);
      line-height: 0.95;
      letter-spacing: 0;
      text-transform: uppercase;
      text-shadow: 0 7px 18px rgba(0, 0, 0, 0.55);
    }

    .tagline {
      max-width: 650px;
      margin: 10px 0 0;
      color: #eaf8ff;
      font-size: clamp(1rem, 1.9vw, 1.25rem);
      font-weight: 700;
      text-shadow: 0 3px 14px rgba(0, 0, 0, 0.55);
    }

    .game-area {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 280px;
      gap: 22px;
      padding: 22px;
      background:
        linear-gradient(90deg, transparent 0 47%, rgba(247, 201, 72, 0.18) 47% 53%, transparent 53% 100%),
        linear-gradient(135deg, rgba(31, 157, 102, 0.32), rgba(6, 19, 30, 0.22));
    }

    .play-panel,
    .score-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-strong);
    }

    .play-panel {
      min-width: 0;
      padding: 24px;
    }

    .score-panel {
      padding: 20px;
      align-self: start;
    }

    .score-label {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
    }

    .wickets {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .wicket {
      aspect-ratio: 1;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      background: linear-gradient(145deg, #f45d48, #a91f1b);
      box-shadow: inset -6px -7px 14px rgba(0, 0, 0, 0.28);
    }

    .wicket.lost {
      background: rgba(255, 255, 255, 0.1);
      box-shadow: none;
    }

    .score-number {
      margin: 0 0 20px;
      font-size: 3.2rem;
      line-height: 1;
      font-weight: 900;
    }

    .guessed {
      min-height: 70px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-content: flex-start;
    }

    .guess-chip {
      display: inline-grid;
      place-items: center;
      min-width: 28px;
      height: 28px;
      padding: 0 8px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.08);
      font-size: 0.8rem;
      font-weight: 800;
    }

    .blanks {
      min-height: 176px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-content: center;
      gap: 18px;
      padding: 22px;
      border: 1px solid rgba(247, 201, 72, 0.35);
      border-radius: 8px;
      background:
        linear-gradient(90deg, rgba(247, 201, 72, 0.12) 0 1px, transparent 1px) center / 64px 100%,
        rgba(16, 78, 59, 0.5);
    }

    .word {
      display: inline-flex;
      gap: clamp(6px, 1.2vw, 10px);
      justify-content: center;
    }

    .box {
      width: clamp(40px, 6.5vw, 58px);
      height: clamp(48px, 7.5vw, 66px);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid rgba(247, 201, 72, 0.82);
      border-radius: 8px;
      background: #fff8df;
      color: #082035;
      font-size: clamp(1.35rem, 3vw, 2rem);
      font-weight: 900;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.22);
    }

    .message {
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 18px 0;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.07);
      font-weight: 800;
      text-align: center;
    }

    .message.good {
      border-color: rgba(122, 230, 184, 0.45);
      color: var(--mint);
    }

    .message.bad {
      border-color: rgba(227, 74, 58, 0.45);
      color: #ffb6ac;
    }

    .keyboard {
      --key-size: clamp(34px, 5vw, 46px);
      display: grid;
      gap: 8px;
    }

    .keyboard-row {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .key {
      width: var(--key-size);
      height: 46px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      cursor: pointer;
      color: #071924;
      background: linear-gradient(180deg, #fff5c3, var(--gold));
      font-weight: 900;
      transition: transform 0.16s ease, filter 0.16s ease, background 0.16s ease;
      user-select: none;
    }

    .key:hover:not(:disabled),
    .key:focus-visible:not(:disabled) {
      transform: translateY(-2px);
      filter: saturate(1.12);
      outline: none;
    }

    .key.correct {
      color: #05251a;
      background: linear-gradient(180deg, #b9ffd9, var(--mint));
    }

    .key.wrong {
      color: #fff;
      background: linear-gradient(180deg, #fa6b58, #b82d25);
    }

    .key:disabled {
      cursor: not-allowed;
      transform: none;
    }

    .actions {
      display: flex;
      justify-content: center;
      margin-top: 18px;
    }

    .play-again {
      min-height: 44px;
      padding: 0 18px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      color: #06131e;
      background: var(--blue);
      font-weight: 900;
      box-shadow: 0 12px 24px rgba(67, 183, 255, 0.22);
    }

    .play-again:hover,
    .play-again:focus-visible {
      filter: brightness(1.06);
      outline: 2px solid rgba(255, 255, 255, 0.8);
      outline-offset: 3px;
    }

    @media (max-width: 820px) {
      .app {
        width: min(100% - 18px, 720px);
        padding: 9px 0;
      }

      .hero {
        min-height: 180px;
      }

      .hero-copy {
        width: calc(100% - 28px);
      }

      .game-area {
        grid-template-columns: 1fr;
        gap: 14px;
        padding: 14px;
      }

      .score-panel {
        order: -1;
      }

      .wickets {
        grid-template-columns: repeat(10, 1fr);
      }

      .score-number {
        font-size: 2.4rem;
      }

      .play-panel,
      .score-panel {
        padding: 16px;
      }

      .blanks {
        min-height: 142px;
        padding: 14px;
      }
    }

    @media (max-width: 520px) {
      .keyboard {
        --key-size: clamp(22px, calc((100vw - 128px) / 10), 32px);
        gap: 6px;
      }

      .keyboard-row {
        gap: 3px;
      }

      .key {
        height: 40px;
        font-size: clamp(0.72rem, 2.6vw, 0.84rem);
      }

      .word {
        gap: 4px;
      }

      .box {
        width: clamp(22px, calc((100vw - 140px) / 10), 40px);
        height: clamp(36px, 11vw, 50px);
        font-size: clamp(1.1rem, 4.6vw, 1.55rem);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="game-shell" aria-labelledby="game-title">
      <header class="hero">
        <img src="howzat.jpeg" alt="" class="title-image">
        <div class="hero-copy">
          <h1 id="game-title" class="visually-hidden">Howzat!</h1>
          <p class="tagline">Guess the England Test cricketer before your ten wickets are gone.</p>
        </div>
      </header>

      <div class="game-area">
        <section class="play-panel" aria-label="Game board">
          <div id="blanks" class="blanks" aria-label="Cricketer name"></div>
          <div class="message" id="message" role="status" aria-live="polite">Choose a letter to start your innings.</div>
          <div class="keyboard" id="keyboard" aria-label="Letter keyboard"></div>
          <div class="actions">
            <button class="play-again" id="play-again" type="button">New innings</button>
          </div>
        </section>

        <aside class="score-panel" aria-label="Scoreboard">
          <p class="score-label">Wickets remaining</p>
          <p class="score-number"><span id="remaining-wickets">10</span>/10</p>
          <div class="wickets" id="wickets" aria-hidden="true"></div>
          <p class="score-label">Letters played</p>
          <div class="guessed" id="guessed" aria-label="Guessed letters"></div>
        </aside>
      </div>
    </section>
  </main>

  <script>
    const cricketers = [
      "Joe Root", "Ben Stokes", "James Anderson", "Alastair Cook", "Ian Bell",
      "Ian Botham", "David Gower", "Mike Gatting", "Graham Gooch", "Allan Lamb",
      "Chris Broad", "Derek Pringle", "Robin Smith", "Alec Stewart",
      "Michael Atherton", "Graeme Hick", "Nasser Hussain", "Mark Ramprakash",
      "Darren Gough", "Andrew Caddick", "Marcus Trescothick", "Andrew Flintoff",
      "Steve Harmison", "Kevin Pietersen", "Matthew Hoggard", "Paul Collingwood",
      "Stuart Broad", "Monty Panesar", "Jonathan Trott", "Graeme Swann",
      "Jos Buttler", "Moeen Ali", "Chris Woakes", "Jonny Bairstow", "Sam Curran",
      "Dom Sibley", "Zak Crawley", "Ollie Pope", "Jofra Archer", "Jack Leach",
      "Dom Bess", "Rory Burns", "Mark Wood", "Ollie Robinson", "Dan Lawrence",
      "Haseeb Hameed", "Ben Foakes", "Rehan Ahmed", "Harry Brook", "Matthew Potts"
    ];

    const maxWickets = 10;
    const keyboardRows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
    const blanksContainer = document.getElementById("blanks");
    const keyboardContainer = document.getElementById("keyboard");
    const message = document.getElementById("message");
    const wicketsRemaining = document.getElementById("remaining-wickets");
    const wicketsContainer = document.getElementById("wickets");
    const guessedContainer = document.getElementById("guessed");
    const playAgain = document.getElementById("play-again");

    let selectedCricketer = "";
    let currentGuess = [];
    let remainingWickets = maxWickets;
    let guessedLetters = [];
    let gameOver = false;

    startGame();

    playAgain.addEventListener("click", startGame);
    document.addEventListener("keydown", event => {
      const letter = event.key.toUpperCase();
      if (/^[A-Z]$/.test(letter)) {
        const keyButton = keyboardContainer.querySelector(`[data-letter="${letter}"]`);
        makeGuess(letter, keyButton);
      }
    });

    function startGame() {
      selectedCricketer = cricketers[Math.floor(Math.random() * cricketers.length)].toUpperCase();
      currentGuess = selectedCricketer.split("").map(char => (char === " " ? " " : "_"));
      remainingWickets = maxWickets;
      guessedLetters = [];
      gameOver = false;

      setMessage("Choose a letter to start your innings.");
      createKeyboard();
      updateUI();
    }

    function createKeyboard() {
      keyboardContainer.innerHTML = "";

      keyboardRows.forEach(row => {
        const rowElement = document.createElement("div");
        rowElement.className = "keyboard-row";

        row.split("").forEach(letter => {
          const keyButton = document.createElement("button");
          keyButton.className = "key";
          keyButton.type = "button";
          keyButton.dataset.letter = letter;
          keyButton.innerText = letter;
          keyButton.setAttribute("aria-label", `Guess ${letter}`);
          keyButton.addEventListener("click", () => makeGuess(letter, keyButton));
          rowElement.appendChild(keyButton);
        });

        keyboardContainer.appendChild(rowElement);
      });
    }

    function makeGuess(letter, keyButton) {
      if (gameOver || !letter || guessedLetters.includes(letter)) {
        return;
      }

      guessedLetters.push(letter);
      const isCorrect = selectedCricketer.includes(letter);

      if (keyButton) {
        keyButton.disabled = true;
        keyButton.classList.add(isCorrect ? "correct" : "wrong");
      }

      if (isCorrect) {
        selectedCricketer.split("").forEach((char, index) => {
          if (char === letter) {
            currentGuess[index] = letter;
          }
        });
        setMessage("Shot. That letter is in the name.", "good");
      } else {
        remainingWickets--;
        setMessage("Appeal upheld. That letter is out.", "bad");
      }

      updateUI();
      checkResult();
    }

    function updateUI() {
      displayBlanks();
      displayWickets();
      displayGuessedLetters();
      wicketsRemaining.innerText = remainingWickets;
    }

    function displayBlanks() {
      blanksContainer.innerHTML = "";

      selectedCricketer.split(" ").forEach((word, wordIndex) => {
        const wordElement = document.createElement("div");
        wordElement.className = "word";

        const precedingLength = selectedCricketer.split(" ").slice(0, wordIndex).join("").length + wordIndex;
        word.split("").forEach((_, letterIndex) => {
          const box = document.createElement("div");
          box.className = "box";
          box.innerText = currentGuess[precedingLength + letterIndex] === "_" ? "" : currentGuess[precedingLength + letterIndex];
          wordElement.appendChild(box);
        });

        blanksContainer.appendChild(wordElement);
      });
    }

    function displayWickets() {
      wicketsContainer.innerHTML = "";

      for (let index = 0; index < maxWickets; index++) {
        const wicket = document.createElement("span");
        wicket.className = index < remainingWickets ? "wicket" : "wicket lost";
        wicketsContainer.appendChild(wicket);
      }
    }

    function displayGuessedLetters() {
      guessedContainer.innerHTML = "";

      guessedLetters.forEach(letter => {
        const chip = document.createElement("span");
        chip.className = "guess-chip";
        chip.innerText = letter;
        guessedContainer.appendChild(chip);
      });

      if (!guessedLetters.length) {
        const chip = document.createElement("span");
        chip.className = "guess-chip";
        chip.innerText = "None";
        guessedContainer.appendChild(chip);
      }
    }

    function checkResult() {
      if (!currentGuess.includes("_")) {
        setMessage(`Well played. You found ${selectedCricketer} with ${remainingWickets} wickets remaining.`, "good");
        endGame();
      } else if (remainingWickets === 0) {
        setMessage(`All out. The cricketer was ${selectedCricketer}.`, "bad");
        endGame();
      }
    }

    function endGame() {
      gameOver = true;
      keyboardContainer.querySelectorAll(".key").forEach(key => {
        key.disabled = true;
      });
    }

    function setMessage(text, tone = "") {
      message.innerText = text;
      message.className = `message ${tone}`.trim();
    }
  </script>
</body>
</html>
